name: Deploy DEVICE CHECKUP to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  source-guardrails:
    name: Source Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require repository security guardrails
        run: python3 security_guardrails.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
      - name: Check Python tool syntax
        run: |
          python -m py_compile tools/expand_batch2.py tools/append_cn_ru.py tools/normalize_generated_structure.py tools/normalize_generated_keyboard.py tools/normalize_display_colors.py tools/normalize_navigation_order.py tools/inject_language_ux.py tools/localize_korean_ui.py tools/finalize_keyboard_help.py tools/validate_dist.py
      - name: Check required source files
        run: |
          set -e
          for file in index.html checkup.html display.html keyboard.html mic.html mobile.html mouse.html speaker.html webcam.html app.js mobile.js styles.css robots.txt sitemap.xml tools/build_global.py.gz tools/expand_batch2.py tools/append_cn_ru.py tools/normalize_generated_structure.py tools/normalize_generated_keyboard.py tools/normalize_display_colors.py tools/normalize_navigation_order.py tools/inject_language_ux.py tools/localize_korean_ui.py tools/finalize_keyboard_help.py tools/validate_dist.py finalcheck/index.html; do
            test -s "$file"
          done

  build-qa:
    name: Build + Artifact QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build localized site
        run: |
          gzip -dc tools/build_global.py.gz > tools/build_global_runtime.py
          python tools/build_global_runtime.py
          rm tools/build_global_runtime.py
          python tools/expand_batch2.py
          python tools/append_cn_ru.py
          python tools/normalize_generated_structure.py
          python tools/normalize_generated_keyboard.py
          python tools/normalize_display_colors.py
          python tools/inject_language_ux.py
          python tools/localize_korean_ui.py
          python tools/finalize_keyboard_help.py
          python tools/normalize_navigation_order.py
          printf '%s\n' "$GITHUB_SHA" > dist/build-revision.txt
      - name: Validate localized artifact
        run: python tools/validate_dist.py
      - name: Validate language and UI coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path('dist').rglob('*.html'))
          assert len(pages)==117, len(pages)
          nav_order=['checkup.html','keyboard.html','mouse.html','display.html','speaker.html','mic.html','webcam.html']
          for p in pages:
              t=p.read_text(encoding='utf-8')
              assert 'id="languagePicker"' in t, p
              assert 'language-ux-v6' in t, p
              assert 'ui-polish-v5' in t, p
              assert 'data-locale=' in t, p
              assert '<details class="notice side-help">' not in t, p
              m=re.search(r'<nav class="navlinks">([\s\S]*?)</nav>',t)
              if m:
                  hrefs=re.findall(r'href="([^"]+)"',m.group(1))
                  bases=[h.split('#',1)[0].split('?',1)[0].rstrip('/').split('/')[-1] for h in hrefs]
                  if all(x in bases for x in nav_order):
                      actual=[x for x in bases if x in nav_order]
                      assert actual==nav_order,(p,actual)
          keyboards=[Path('dist/keyboard.html'), *sorted(Path('dist').glob('*/keyboard.html'))]
          assert len(keyboards)==13, len(keyboards)
          for p in keyboards:
              t=p.read_text(encoding='utf-8')
              assert '<details class="keyboard-help">' in t, p
              assert '<aside class="side">' in t and '<div class="notice"><strong>' in t, p
          displays=[Path('dist/display.html'), *sorted(Path('dist').glob('*/display.html'))]
          assert len(displays)==13, len(displays)
          for p in displays:
              t=p.read_text(encoding='utf-8')
              assert t.count('class="color-btn"')==8, p
              assert t.count('class="btn screen-color"')==8, p
          mobiles=[Path('dist/mobile.html'), *sorted(Path('dist').glob('*/mobile.html'))]
          assert len(mobiles)==13, len(mobiles)
          revision=Path('dist/build-revision.txt').read_text(encoding='utf-8').strip()
          assert revision
          PY
      - name: Add FinalCheck static frontend after DEVICE CHECKUP QA
        run: |
          mkdir -p dist/finalcheck
          cp finalcheck/index.html dist/finalcheck/index.html
          test -s dist/finalcheck/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [source-guardrails, build-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent checks to pass
        env:
          SOURCE_RESULT: ${{ needs.source-guardrails.result }}
          BUILD_RESULT: ${{ needs.build-qa.result }}
        run: |
          test "$SOURCE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  deploy:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  finalcheck-smoke:
    name: FinalCheck E2E · Chromium
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for FinalCheck page
        run: |
          set -euo pipefail
          url='https://gsh4124-cyber.github.io/pc-checkup/finalcheck/'
          for i in {1..30}; do
            body=$(curl -fsSL --max-time 20 "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '<h1>FinalCheck AI</h1>'; then
              echo 'FinalCheck HTML rendered by static hosting.'
              exit 0
            fi
            sleep 5
          done
          echo 'FinalCheck page did not become available.'
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run FinalCheck browser flow
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const url='https://gsh4124-cyber.github.io/pc-checkup/finalcheck/';
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            if((await page.locator('h1').textContent()).trim()!=='FinalCheck AI') throw new Error('render failed');
            await page.click('#check');
            await page.waitForFunction(()=>document.querySelector('#gateTitle')?.textContent.includes('READY TO SUBMIT'),null,{timeout:30000});
            const fail1=Number(await page.locator('#cf').textContent());
            const need1=Number(await page.locator('#cn').textContent());
            if(fail1<1 || need1<1) throw new Error(`expected initial blockers, fail=${fail1}, need=${need1}`);
            await page.click('#submit');
            await page.waitForSelector('#overlay',{state:'visible'});
            await page.click('#close');
            await page.click('#fix');
            await page.click('#check');
            await page.waitForFunction(()=>document.querySelector('#gateTitle')?.textContent==='READY TO SUBMIT: YES',null,{timeout:30000});
            const fail2=Number(await page.locator('#cf').textContent());
            const need2=Number(await page.locator('#cn').textContent());
            if(fail2!==0 || need2!==0) throw new Error(`blockers remain, fail=${fail2}, need=${need2}`);
            console.log('FinalCheck E2E PASS: render → detect → block → fix → READY');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

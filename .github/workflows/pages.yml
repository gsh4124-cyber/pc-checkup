name: Deploy DEVICE CHECKUP to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  source-guardrails:
    name: Source Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js

      - name: Check Python tool syntax
        run: |
          python -m py_compile \
            tools/expand_batch2.py \
            tools/append_cn_ru.py \
            tools/normalize_generated_structure.py \
            tools/normalize_generated_keyboard.py \
            tools/normalize_display_colors.py \
            tools/normalize_navigation_order.py \
            tools/inject_language_ux.py \
            tools/localize_korean_ui.py \
            tools/finalize_keyboard_help.py \
            tools/validate_dist.py

      - name: Check required source files
        run: |
          set -e
          for file in index.html checkup.html display.html keyboard.html mic.html mobile.html mouse.html speaker.html webcam.html app.js mobile.js styles.css robots.txt sitemap.xml tools/build_global.py.gz tools/expand_batch2.py tools/append_cn_ru.py tools/normalize_generated_structure.py tools/normalize_generated_keyboard.py tools/normalize_display_colors.py tools/normalize_navigation_order.py tools/inject_language_ux.py tools/localize_korean_ui.py tools/finalize_keyboard_help.py tools/validate_dist.py; do
            test -s "$file"
          done

  build-qa:
    name: Build + Artifact QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build localized site
        run: |
          gzip -dc tools/build_global.py.gz > tools/build_global_runtime.py
          python tools/build_global_runtime.py
          rm tools/build_global_runtime.py
          python tools/expand_batch2.py
          python tools/append_cn_ru.py
          python tools/normalize_generated_structure.py
          python tools/normalize_generated_keyboard.py
          python tools/normalize_display_colors.py
          python tools/inject_language_ux.py
          python tools/localize_korean_ui.py
          python tools/finalize_keyboard_help.py
          python tools/normalize_navigation_order.py
          printf '%s\n' "$GITHUB_SHA" > dist/build-revision.txt

      - name: Validate localized artifact
        run: python tools/validate_dist.py

      - name: Validate language and UI coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path('dist').rglob('*.html'))
          assert len(pages)==117, len(pages)
          nav_order=['checkup.html','keyboard.html','mouse.html','display.html','speaker.html','mic.html','webcam.html']
          for p in pages:
              t=p.read_text(encoding='utf-8')
              assert 'id="languagePicker"' in t, p
              assert 'language-ux-v6' in t, p
              assert 'ui-polish-v5' in t, p
              assert 'data-locale=' in t, p
              assert '<details class="notice side-help">' not in t, p
              m=re.search(r'<nav class="navlinks">([\s\S]*?)</nav>',t)
              if m:
                  hrefs=re.findall(r'href="([^"]+)"',m.group(1))
                  bases=[h.split('#',1)[0].split('?',1)[0].rstrip('/').split('/')[-1] for h in hrefs]
                  if all(x in bases for x in nav_order):
                      actual=[x for x in bases if x in nav_order]
                      assert actual==nav_order,(p,actual)
          keyboards=[Path('dist/keyboard.html'), *sorted(Path('dist').glob('*/keyboard.html'))]
          assert len(keyboards)==13, len(keyboards)
          for p in keyboards:
              t=p.read_text(encoding='utf-8')
              assert '<details class="keyboard-help">' in t, p
              assert '<aside class="side">' in t and '<div class="notice"><strong>' in t, p
              assert not re.search(r'<div class="keyboard-actions">[\s\S]*?<button id="fnArm"[\s\S]*?</div>\s*<p class="keyboard-note">', t), p
          displays=[Path('dist/display.html'), *sorted(Path('dist').glob('*/display.html'))]
          assert len(displays)==13, len(displays)
          for p in displays:
              t=p.read_text(encoding='utf-8')
              assert t.count('class="color-btn"')==8, (p, t.count('class="color-btn"'))
              assert t.count('class="btn screen-color"')==8, (p, t.count('class="btn screen-color"'))
              for color in ['#ffffff','#000000','#ff0000','#00ff00','#0000ff','#808080','#ffff00','#00ffff']:
                  assert t.count(f'data-color="{color}"')>=2, (p, color)
          mobiles=[Path('dist/mobile.html'), *sorted(Path('dist').glob('*/mobile.html'))]
          assert len(mobiles)==13, len(mobiles)
          for p in mobiles:
              t=p.read_text(encoding='utf-8')
              assert t.count('data-open-screen=')==8, (p, t.count('data-open-screen='))
              assert t.count('data-set-screen=')==8, (p, t.count('data-set-screen='))
          ko_display=Path('dist/display.html').read_text(encoding='utf-8')
          ko_mobile=Path('dist/mobile.html').read_text(encoding='utf-8')
          for label in ['회색','노랑','청록']:
              assert label in ko_display, label
              assert label in ko_mobile, label
          ko=Path('dist/keyboard.html').read_text(encoding='utf-8')
          for phrase in ['Start keyboard test','Exit keyboard test','Fn check','Fn status:','Common ANSI-style layout.']:
              assert phrase not in ko, phrase
          revision=Path('dist/build-revision.txt').read_text(encoding='utf-8').strip()
          assert revision, 'build revision missing'
          print(f'Language UX, responsive readability, visible sidebar help consistency, 8-color display parity, and canonical PC navigation order present on all required pages; build revision={revision}')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [source-guardrails, build-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent checks to pass
        env:
          SOURCE_RESULT: ${{ needs.source-guardrails.result }}
          BUILD_RESULT: ${{ needs.build-qa.result }}
        run: |
          echo "source=$SOURCE_RESULT"
          echo "build=$BUILD_RESULT"
          test "$SOURCE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  deploy:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

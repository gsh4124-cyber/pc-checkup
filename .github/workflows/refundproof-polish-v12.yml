name: Apply RefundProof V12 Visual Redesign

on:
  push:
    branches: [main]
    paths:
      - 'tools/polish_refundproof_v12.py'
      - '.github/workflows/refundproof-polish-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply visual redesign
        run: python tools/polish_refundproof_v12.py
      - name: Commit redesigned demo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refundproof/wanted-demo.html
          if git diff --cached --quiet; then
            echo 'No visual changes to commit.'
            exit 0
          fi
          git commit -m 'Redesign RefundProof demo for submission'
          git push

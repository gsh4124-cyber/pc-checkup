name: RefundProof Wanted Demo QA

on:
  push:
    branches: [main]
    paths:
      - 'refundproof/wanted-demo.html'
      - '.github/workflows/refundproof-wanted-demo.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wanted-demo:
    name: 30-second evidence pack flow
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for public Wanted demo
        run: |
          set -euo pipefail
          url='https://gsh4124-cyber.github.io/pc-checkup/refundproof/wanted-demo.html'
          for i in {1..50}; do
            body=$(curl -fsSL --max-time 20 "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'WANTED_DEMO_V1'; then exit 0; fi
            sleep 5
          done
          echo 'Wanted demo build did not become public.'
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify AI → GAP → evidence pack → inquiry draft
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://gsh4124-cyber.github.io/pc-checkup/refundproof/wanted-demo.html',{waitUntil:'networkidle',timeout:60000});
            const start=Date.now();
            await page.click('#demo');
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.trim()==='GAP',null,{timeout:120000});
            const vals={
              base:Number(await page.inputValue('#base')),
              offered:Number(await page.inputValue('#offered')),
              air:Number(await page.inputValue('#airPenalty')),
              ota:Number(await page.inputValue('#otaFee')),
              non:Number(await page.inputValue('#nonRefund'))
            };
            assert(vals.base===635000,`base ${vals.base}`);
            assert(vals.offered===458000,`offered ${vals.offered}`);
            assert(vals.air===80000,`air ${vals.air}`);
            assert(vals.ota===20000,`ota ${vals.ota}`);
            assert(vals.non===0,`non ${vals.non}`);
            assert((await page.textContent('#expected')).replace(/[^0-9]/g,'')==='535000','expected refund');
            assert((await page.textContent('#gapAmount')).replace(/[^0-9]/g,'')==='77000','gap amount');
            assert(await page.locator('#evidenceRows tr').count()===5,'evidence rows');
            const draft=await page.textContent('#draft');
            assert(draft.includes('535,000원'),'draft expected');
            assert(draft.includes('458,000원'),'draft offered');
            assert(draft.includes('77,000원'),'draft gap');
            assert(draft.includes('추가 차감된 항목명·금액·적용 규정'),'draft ask');
            const elapsed=(Date.now()-start)/1000;
            console.log('PASS GAP evidence flow',vals,'elapsedSec',elapsed.toFixed(1));
            await page.fill('#offered','535000');
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='MATCH','match after corrected offer');
            assert(await page.locator('#pack.hidden').count()===1,'pack hidden on MATCH');
            console.log('PASS corrected offer → MATCH');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

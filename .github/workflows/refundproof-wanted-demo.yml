name: RefundProof Wanted Demo QA

on:
  push:
    branches: [main]
    paths:
      - 'refundproof/wanted-demo.html'
      - '.github/workflows/refundproof-wanted-demo.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wanted-demo:
    name: Seller whitelist, fare-rule safety, visible checklist
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for public Wanted demo V6
        run: |
          set -euo pipefail
          url='https://gsh4124-cyber.github.io/pc-checkup/refundproof/wanted-demo.html'
          for i in {1..60}; do
            body=$(curl -fsSL --max-time 20 "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'WANTED_DEMO_V6' && printf '%s' "$body" | grep -q '판매처 수수료'; then exit 0; fi
            sleep 5
          done
          echo 'Wanted demo V6 did not become public.'
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify calculation gates, checklist, and customer-first hierarchy
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://gsh4124-cyber.github.io/pc-checkup/refundproof/wanted-demo.html',{waitUntil:'networkidle',timeout:60000});
            assert(await page.locator('#details.hidden').count()===1,'details hidden initially');
            assert(await page.locator('#checkSeller').count()===1,'seller checklist visible');
            assert(await page.locator('#checkSellerFee').count()===1,'seller fee checklist visible');
            assert(await page.locator('#checkFare').count()===1,'fare checklist visible');

            // 1) Verified Jeju Air direct purchase.
            await page.click('#demo');
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.trim()==='환불금액에 차이가 있어요',null,{timeout:60000});
            assert(Number(await page.inputValue('#airPenalty'))===60000,'Jeju penalty');
            assert(Number(await page.inputValue('#otaFee'))===0,'direct seller fee');
            assert((await page.textContent('#expected')).replace(/[^0-9]/g,'')==='575000','Jeju expected');
            assert((await page.textContent('#shown')).replace(/[^0-9]/g,'')==='548000','seller shown');
            assert((await page.textContent('#delta')).replace(/[^0-9]/g,'')==='27000','gap summary');
            assert((await page.textContent('#checkSeller')).includes('제주항공'),'seller check result');
            assert((await page.textContent('#checkSellerFee')).includes('별도 수수료 없음'),'direct seller fee check');
            assert((await page.textContent('#checkFare')).includes('공식 공개 운임표'),'fare rule check');
            assert((await page.textContent('#checkCalc')).includes('계산 조건 충족'),'calculation check');
            console.log('PASS direct airline case + visible checklist');

            // 2) Unknown seller must stop.
            await page.evaluate(()=>{
              document.querySelector('#booking').value=document.querySelector('#booking').value.replace('구매처 제주항공','구매처 임의여행사');
              document.querySelector('#quote').value='취소 접수일 2026-09-20\n예상 환불액 558,000원\n판매처 수수료 17,000원';
            });
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='추가 확인이 필요해요','unknown seller stop');
            assert((await page.textContent('#message')).includes('판매처 수수료 확인 불가'),'unknown seller policy message');
            assert((await page.textContent('#checkSellerFee')).includes('공개 약관 확인 불가'),'checklist unknown seller');
            assert((await page.textContent('#expected')).trim()==='-','unknown seller no amount');
            console.log('PASS unknown seller remains unavailable');

            // 3) Whitelisted seller policy is recognized, but actual applied amount is still required.
            await page.evaluate(()=>{
              document.querySelector('#booking').value=document.querySelector('#booking').value.replace('구매처 임의여행사','구매처 마이리얼트립');
              document.querySelector('#quote').value='취소 접수일 2026-09-20\n예상 환불액 545,000원';
            });
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='추가 확인이 필요해요','known seller missing applied amount stop');
            assert((await page.textContent('#checkSellerFee')).includes('실제 적용 금액 확인 필요'),'seller fee checklist needs amount');
            console.log('PASS known seller still requires reservation-level amount');

            // 4) Whitelisted seller + documented applied amount can compute.
            await page.evaluate(()=>{document.querySelector('#quote').value='취소 접수일 2026-09-20\n예상 환불액 545,000원\n판매처 수수료 30,000원';});
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='금액이 맞아요','known seller documented fee match');
            assert(Number(await page.inputValue('#otaFee'))===30000,'seller fee parsed');
            assert((await page.textContent('#checkSellerFee')).includes('30,000원'),'documented seller fee checklist');
            console.log('PASS whitelisted seller + applied fee');

            // 5) Fare Basis known but no exact fare rule must stop.
            await page.evaluate(()=>{
              document.querySelector('#booking').value='예약번호 KE1234\n항공사 대한항공 KE703\n여정 인천(ICN) → 도쿄(NRT)\n출발일 2026-09-30\n예약등급 V\nFare Basis VKOR123\n결제금액 635,000원\n구매처 대한항공\n사용상태 전체 미사용';
              document.querySelector('#quote').value='취소 접수일 2026-09-20\n예상 환불액 545,000원';
              document.querySelector('#fareRule').value='';
            });
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='추가 확인이 필요해요','missing fare rule stop');
            assert(await page.locator('#fareAsk:not(.hidden)').count()===1,'fare ask visible');
            assert((await page.textContent('#checkFare')).includes('운임규칙 추가 확인 필요'),'fare checklist');
            console.log('PASS fare basis alone not enough');

            // 6) Exact same Fare Basis + exactly one penalty resolves.
            await page.evaluate(()=>{document.querySelector('#fareRule').value='Fare Basis VKOR123\n환불 위약금 90,000원';});
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='금액이 맞아요','exact fare rule match');
            assert(Number(await page.inputValue('#airPenalty'))===90000,'exact penalty');
            assert((await page.textContent('#checkFare')).includes('Fare Basis VKOR123 일치'),'exact fare checklist');
            console.log('PASS exact fare-rule match');

            // 7) Different Fare Basis must stop.
            await page.evaluate(()=>{document.querySelector('#fareRule').value='Fare Basis OTHER999\n환불 위약금 90,000원';});
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='추가 확인이 필요해요','basis mismatch stop');
            assert((await page.textContent('#expected')).trim()==='-','basis mismatch no amount');
            console.log('PASS basis mismatch stop');

            // 8) Multiple penalty values must stop.
            await page.evaluate(()=>{document.querySelector('#fareRule').value='Fare Basis VKOR123\n환불 위약금 90,000원\n환불 위약금 120,000원';});
            await page.click('#audit');
            assert((await page.textContent('#status')).trim()==='추가 확인이 필요해요','multiple penalties stop');
            assert((await page.textContent('#message')).includes('여러 개'),'multiple penalty message');
            console.log('PASS ambiguous fare-rule table stop');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

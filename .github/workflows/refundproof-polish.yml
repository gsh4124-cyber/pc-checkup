name: RefundProof Visual Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refundproof-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual polish only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('refundproof/wanted-demo.html')
          s = p.read_text(encoding='utf-8')
          css = r'''<style>
:root{--ink:#0d1324;--muted:#6b7280;--line:#e7eaf0;--surface:#ffffff;--soft:#f7f8fb;--accent:#5b5cf0;--accent2:#8b5cf6;--ok:#15805f;--okbg:#eefaf6;--bad:#c53d58;--badbg:#fff1f4;--warn:#8a6200;--warnbg:#fff8e7}*{box-sizing:border-box}html{background:#f4f6fb}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 0%,rgba(91,92,240,.13),transparent 30%),radial-gradient(circle at 88% 8%,rgba(139,92,246,.12),transparent 28%),linear-gradient(180deg,#f7f8fc 0,#f3f5fa 100%);color:var(--ink);min-height:100vh}button,input{font:inherit}main{max-width:1120px;margin:auto;padding:30px 18px 80px}.hero{position:relative;text-align:center;padding:56px 20px 34px}.hero:before{content:'AI REFUND AUDIT';display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(91,92,240,.16);box-shadow:0 8px 28px rgba(36,42,78,.08);backdrop-filter:blur(12px);color:#5558d9;font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:18px}.hero h1{font-size:clamp(48px,8vw,78px);line-height:.94;margin:0 0 20px;letter-spacing:-.055em;font-weight:950;background:linear-gradient(135deg,#11172a 10%,#4346c7 58%,#8b5cf6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:720px;margin:auto;color:#687084;font-size:18px;line-height:1.68;letter-spacing:-.015em}.hero strong{color:#1b2236;font-weight:900}.microflow{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:19px}.microflow span{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid rgba(20,28,48,.08);background:rgba(255,255,255,.62);border-radius:999px;color:#747c8e;font-size:11px;font-weight:750;backdrop-filter:blur(10px)}.microflow span+span:before{content:'→';margin-right:7px;color:#aaaedf}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.card{position:relative;background:rgba(255,255,255,.88);border:1px solid rgba(14,20,38,.075);border-radius:28px;box-shadow:0 18px 55px rgba(27,35,67,.075),inset 0 1px rgba(255,255,255,.9);padding:26px;min-width:0;backdrop-filter:blur(18px)}.resultcard{box-shadow:0 22px 64px rgba(53,54,140,.11),inset 0 1px rgba(255,255,255,.9)}.card h2{font-size:20px;letter-spacing:-.025em;margin:0 0 6px;font-weight:900}.sub{margin:0 0 18px;color:#7a8292;font-size:13px;line-height:1.58}.uploadstack{display:grid;gap:11px}.upload{border:1px solid #eaecf2;background:linear-gradient(180deg,#fff 0,#fafbfe 100%);border-radius:18px;padding:16px;transition:.18s ease}.upload:hover{transform:translateY(-1px);border-color:#d9dcfb;box-shadow:0 10px 28px rgba(66,69,160,.07)}.uploadhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.upload b{display:block;font-size:15px;letter-spacing:-.018em}.upload p{margin:5px 0 0;color:#8b92a0;font-size:12px;line-height:1.45}.filebtn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e1e3f8;background:#f2f2ff;color:#5153c9;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer;font-size:12px;transition:.16s}.filebtn:hover{background:#e9e9ff;transform:translateY(-1px)}.filebtn input{display:none}.attached{margin-top:11px;font-size:11px;color:#6f788b}.primary{width:100%;border:0;border-radius:15px;padding:15px 17px;background:linear-gradient(135deg,#5558e8 0%,#755cf2 55%,#9258ed 100%);color:white;font-weight:950;cursor:pointer;margin-top:16px;box-shadow:0 12px 26px rgba(91,92,240,.24);letter-spacing:-.01em;transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 15px 32px rgba(91,92,240,.28)}.primary:disabled{opacity:.58;cursor:wait;transform:none}.status{margin-top:11px;padding:11px 13px;border:1px solid #e4e7ee;background:#f8f9fb;border-radius:12px;color:#626b7e;font-size:12px;line-height:1.48}.status.ok{border-color:#ccebdd;background:var(--okbg);color:#14684f}.status.warn{border-color:#eedcae;background:var(--warnbg);color:var(--warn)}.ask{padding:13px 14px;border:1px solid #ead8a9;background:var(--warnbg);color:#725500;border-radius:14px;margin-top:11px;font-size:12px;line-height:1.5}.ask label{display:block;font-weight:850;margin-bottom:7px}.ask input{width:100%;border:1px solid #d7dce7;background:#fff;border-radius:11px;padding:11px 12px;font-size:16px;outline:none}.ask input:focus{border-color:#aaaaf0;box-shadow:0 0 0 4px rgba(91,92,240,.09)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary{border:1px solid #e3e6ed;background:#fff;color:#3e475b;border-radius:12px;padding:9px 12px;font-weight:850;cursor:pointer;transition:.15s}.secondary:hover{background:#f7f8fb}.hidden{display:none!important}.checkwrap{border:1px solid #eceef3;border-radius:18px;padding:14px;background:linear-gradient(180deg,#fbfbfd,#f7f8fb);margin-bottom:19px}.checkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.checktitle{font-size:13px;font-weight:950}.checkcount{font-size:10px;color:#747d8f;font-weight:900;padding:5px 8px;border-radius:999px;background:#fff;border:1px solid #eceef3}.checklist{display:grid;gap:6px}.checkrow{display:grid;grid-template-columns:24px 126px 1fr;gap:8px;align-items:center;min-height:36px;padding:6px 7px;border-radius:11px}.checkrow.done{background:var(--okbg)}.checkrow.warn{background:var(--warnbg)}.checkicon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ebeef3;color:#7f8796;font-weight:950}.checkrow.done .checkicon{background:#d7f1e5;color:var(--ok)}.checkrow.warn .checkicon{background:#f6e6b9;color:var(--warn)}.checkrow b{font-size:11px}.checkrow span:last-child{font-size:11px;color:#747d8d;line-height:1.35}.resulttop{padding:3px 0}.resultlabel{font-size:11px;color:#7a8292;font-weight:900;letter-spacing:.01em}.mainamount{font-size:clamp(48px,7vw,66px);font-weight:950;letter-spacing:-.055em;line-height:1;margin:8px 0 18px;color:#12182a}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.comparebox{border:1px solid #eceef3;background:#fafbfc;border-radius:15px;padding:13px}.comparebox span{display:block;font-size:10px;color:#8a92a1;margin-bottom:5px;font-weight:750}.comparebox b{font-size:20px;letter-spacing:-.03em}.result{margin-top:12px;border-radius:16px;padding:15px;border:1px solid #e3e6ed;background:#f9fafc}.result.gap{border-color:#efc0c9;background:var(--badbg)}.result.match{border-color:#b9e2d0;background:var(--okbg)}.result.warn{border-color:#ead8a9;background:var(--warnbg)}.result h3{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}.amount{font-size:30px;font-weight:950;color:var(--bad);margin-top:6px;letter-spacing:-.035em}.detailsbtn{margin-top:13px;width:100%;border:1px solid #e6e8ee;background:#fff;color:#485267;border-radius:13px;padding:11px 12px;font-weight:850;cursor:pointer}.details{margin-top:11px;border-top:1px solid #eceef2;padding-top:13px}.context,.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip,.metric{background:#fafbfc;border:1px solid #e7eaf0;border-radius:12px;padding:10px}.chip span,.metric span{display:block;font-size:9px;color:#8a92a0;font-weight:850}.chip b,.metric b{display:block;margin-top:4px;font-size:12px}.rule{border-left:3px solid #7779ef;background:#f5f5ff;padding:11px 12px;border-radius:10px;margin-top:9px}.rule.warn{border-left-color:#d7a228;background:var(--warnbg)}.rule b{font-size:12px}.rule small{display:block;color:#70788a;line-height:1.48;margin-top:3px}.rule a{color:#5558d9;font-weight:750}.calc{margin-top:9px}.metric b{font-size:13px}.foot{font-size:10px;color:#9299a7;line-height:1.48;margin:11px 0 0}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border-bottom:1px solid #e7eaf0;padding:8px;text-align:left;vertical-align:top}th{background:#f8f9fb}.draft{white-space:pre-wrap;background:#fafbfc;border:1px solid #e4e7ed;border-radius:13px;padding:12px;line-height:1.55;font-size:12px}#pack h2{font-size:16px;margin:17px 0 8px}textarea{display:none}@media(min-width:900px){.resultcard{position:sticky;top:18px}}@media(max-width:760px){main{padding:18px 12px 56px}.hero{padding:38px 10px 25px}.hero h1{font-size:48px}.hero p{font-size:16px}.layout{grid-template-columns:1fr}.card{padding:18px;border-radius:22px}.mainamount{font-size:48px}.checkrow{grid-template-columns:24px 110px 1fr}}@media(max-width:390px){.compare,.context,.calc{grid-template-columns:1fr}.uploadhead{display:block}.filebtn{margin-top:10px;width:100%}.checkrow{grid-template-columns:24px 1fr}.checkrow span:last-child{grid-column:2}.checkhead{align-items:flex-start;flex-direction:column;gap:4px}}
</style>'''
          ns, n = re.subn(r'<style>.*?</style>', css, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('style block not found')
          if ns == s:
              raise SystemExit('no visual change')
          p.write_text(ns, encoding='utf-8')
      - name: Commit polished UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refundproof/wanted-demo.html
          git commit -m 'Polish RefundProof submission UI'
          git push

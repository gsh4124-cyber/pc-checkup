name: RefundProof Sample Path Once

# trigger sample-path patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refundproof-sample-path-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add obvious sample verification path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('refundproof/wanted-demo.html')
          s=p.read_text(encoding='utf-8')
          if 'id="sampleDemo"' in s:
              print('sample path already present')
              raise SystemExit(0)

          css_marker='.primary{width:100%;'
          if css_marker not in s:
              raise SystemExit('primary css marker missing')
          sample_css='.samplebtn{width:100%;border:1px solid rgba(117,92,255,.24);border-radius:15px;padding:14px;background:linear-gradient(135deg,#f3f0ff,#eef8ff);color:#3e3a87;font-weight:950;cursor:pointer;margin-top:16px;box-shadow:0 10px 24px rgba(42,48,92,.08);transition:.18s ease}.samplebtn:before{content:"⚡";margin-right:7px}.samplebtn:hover{transform:translateY(-1px);border-color:rgba(117,92,255,.42);box-shadow:0 13px 28px rgba(42,48,92,.11)}'
          s=s.replace(css_marker,sample_css+css_marker,1)

          button_marker='<button class="primary" id="demo">내 환불액 확인하기</button><div id="aiStatus" class="status ok">예시 자료로 바로 체험할 수 있어요.</div>'
          button_new='<button class="samplebtn" id="sampleDemo" type="button">샘플로 10초 체험하기</button><button class="primary" id="demo">내 자료로 환불액 확인하기</button><div id="aiStatus" class="status ok">자료가 없어도 샘플로 전체 검증 흐름을 바로 확인할 수 있어요.</div>'
          if button_marker not in s:
              raise SystemExit('button marker missing')
          s=s.replace(button_marker,button_new,1)

          attached_marker='<div class="attached"><b>예시 자료 준비됨</b> · 직접 올리면 교체됩니다.</div>'
          s=s.replace(attached_marker,'<div class="attached"><b>샘플 데이터 포함</b> · 위 체험 버튼으로 바로 검증할 수 있고, 직접 올리면 교체됩니다.</div>')

          hook='''\nconst sampleBooking=`예약번호 AB12CD\n항공사 제주항공 7C1102\n여정 인천(ICN) → 도쿄(NRT)\n출발일 2026-09-30\n운임종류 STANDARD\n예약등급 M\nFare Basis MSTANDARD\n결제금액 635,000원\n구매처 제주항공\n사용상태 전체 미사용`;\nconst sampleQuote=`취소 접수일 2026-09-20\n예상 환불액 548,000원\n세부 공제내역은 고객센터로 문의해 주세요.`;\n$('sampleDemo').addEventListener('click',()=>{\n  $('booking').value=sampleBooking; $('quote').value=sampleQuote; $('fareRule').value='';\n  for(const id of ['bookingFile','quoteFile','fareFile']){const el=$(id); if(el) el.value='';}\n  $('aiStatus').className='status ok'; $('aiStatus').textContent='샘플 예약·환불 안내로 독립 검산 중입니다.';\n  $('demo').click();\n});\n'''
          if '</script>' not in s:
              raise SystemExit('script close missing')
          s=s.replace('</script>',hook+'</script>',1)
          s=s.replace('WANTED_DEMO_V12','WANTED_DEMO_V13',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit sample path
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refundproof/wanted-demo.html
          git commit -m 'Add one-click RefundProof sample verification path'
          git push

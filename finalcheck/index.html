<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinalCheck AI</title><style>:root{font-family:Inter,Pretendard,system-ui,sans-serif;color:#111827;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#111827;color:#fff;padding:26px;border-radius:22px}.hero h1{margin:6px 0;font-size:42px}.hero p{color:#d1d5db;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card,.status{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px}.pill{font-size:11px;font-weight:800;color:#4338ca;background:#eef2ff;border-radius:999px;padding:5px 9px;display:inline-block}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;font:inherit}textarea{min-height:100px}.rules{min-height:250px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.dark{background:#111827;color:#fff}.ghost{background:#eef2ff;color:#3730a3}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.count{text-align:center;background:#f8fafc;border-radius:12px;padding:10px}.count strong{display:block;font-size:22px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:8px}.top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px}.ok{background:#d1fae5;color:#065f46}.fail{background:#fee2e2;color:#991b1b}.risk{background:#fef3c7;color:#92400e}.need{background:#e0e7ff;color:#3730a3}.meta{font-size:12px;color:#4b5563;margin-top:7px}.gate{display:flex;justify-content:space-between;align-items:center;gap:12px}.gate h2{margin:0}.checkline{display:flex;gap:8px;margin-top:10px;font-size:12px}.checkline input{width:auto}.overlay{position:fixed;inset:0;background:rgba(17,24,39,.58);display:none;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:34px}}</style></head><body><main class="wrap"><section class="hero"><div class="pill">Wanted AI Championship Prototype</div><h1>FinalCheck AI</h1><p><b>보내기 전에, 실패할 이유부터.</b><br>공고·안내문과 현재 작성한 웹폼을 대조해 누락·위험·충돌을 잡습니다.</p></section><div class="grid"><section class="card"><div class="pill">1 · SOURCE OF TRUTH</div><h2>요구사항</h2><textarea id="rules" class="rules">필수 입력 항목을 모두 작성해야 합니다.
서비스는 심사 기간 동안 공개 링크로 정상 접속할 수 있어야 합니다.
프로젝트가 해결하려는 문제와 사용자를 명확하게 설명해야 합니다.
AI가 어떤 역할을 하고 왜 필요한지 설명해야 합니다.
개인정보나 회사 기밀을 포함하면 안 됩니다.</textarea></section><section class="card"><div class="pill">2 · CURRENT FORM</div><h2>현재 제출폼</h2><label>프로젝트명 *</label><input id="project" value="FinalCheck AI"><label>문제와 사용자 *</label><textarea id="problem">취업·공모전·지원사업처럼 중요한 온라인 제출에서 사용자는 공고와 작성 화면을 오가며 누락을 직접 확인해야 합니다.</textarea><label>AI 활용 방식 *</label><textarea id="aiuse" placeholder="일부러 비워둔 데모 항목입니다."></textarea><label>공개 서비스 URL *</label><input id="serviceUrl" type="url" value="https://gsh4124-cyber.github.io/pc-checkup/finalcheck/"><label>설명 *</label><textarea id="description">FinalCheck는 요구사항과 현재 폼을 대조하고 빈칸·URL·형식은 코드로, 의미 충족은 AI로 검사합니다.</textarea><div class="checkline"><input id="privacy" type="checkbox"><span>개인정보·기밀이 포함되지 않았음을 확인했습니다.</span></div><div class="actions"><button id="check" class="primary">FINAL CHECK</button><button id="submit" class="dark">제출</button><button id="fix" class="ghost">데모 오류 자동 수정</button></div></section></div><section class="status"><div class="gate"><div><h2 id="gateTitle">아직 검사하지 않았습니다</h2><div id="gateSub" class="meta">FINAL CHECK를 눌러주세요.</div></div><span id="gateBadge" class="badge need">NOT CHECKED</span></div><div class="counts"><div class="count"><strong id="cv">0</strong>VERIFIED</div><div class="count"><strong id="cf">0</strong>FAIL</div><div class="count"><strong id="cr">0</strong>RISK</div><div class="count"><strong id="cn">0</strong>NEED INFO</div></div><div id="results"></div></section></main><div id="overlay" class="overlay"><div class="modal"><h2>WAIT — 제출 전에 문제가 발견됐습니다.</h2><div id="modalBody" class="meta"></div><div class="actions"><button id="close" class="ghost">돌아가서 수정</button></div></div></div><script>const API='https://afiqaibosavbjzkffggr.supabase.co/functions/v1/finalcheck-ai';const $=s=>document.querySelector(s);let last=[];function row(req,status,evidence,action,mode){return{req,status,evidence,action,mode}}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function probe(u){try{const r=await fetch(API+'?probe='+encodeURIComponent(u)+'&t='+Date.now(),{cache:'no-store'});return await r.json()}catch(e){return{ok:false,status:0}}}function semantic(req,txt){const q=req.toLowerCase(),t=txt.toLowerCase();const groups=[['ai','인공지능','모델','임베딩','semantic'],['문제','사용자','user','problem'],['설명','description','프로젝트']];let score=0;for(const g of groups){if(g.some(x=>q.includes(x))&&g.some(x=>t.includes(x)))score+=1}return score}async function run(){const v={project:$('#project').value.trim(),problem:$('#problem').value.trim(),aiuse:$('#aiuse').value.trim(),serviceUrl:$('#serviceUrl').value.trim(),description:$('#description').value.trim(),privacy:$('#privacy').checked};const rows=[];for(const [k,n] of [['project','프로젝트명'],['problem','문제와 사용자'],['aiuse','AI 활용 방식'],['serviceUrl','서비스 URL'],['description','설명']])rows.push(v[k]?row(n,'VERIFIED',n+' 값 존재','유지','CODE'):row(n,'FAIL',n+' 누락','작성 필요','CODE'));try{new URL(v.serviceUrl);const p=await probe(v.serviceUrl);rows.push(p.ok?row('공개 링크 접근','VERIFIED','HTTP '+p.status,'공개 상태 유지','EXTERNAL'):row('공개 링크 접근','FAIL','접근 실패'+(p.status?' HTTP '+p.status:''),'URL/배포 확인','EXTERNAL'))}catch(e){rows.push(row('공개 링크 형식','FAIL','유효한 URL 아님','https:// URL 입력','CODE'))}rows.push(v.privacy?row('개인정보·기밀 확인','VERIFIED','사용자 확인 완료','제출 전 유지','USER'):row('개인정보·기밀 확인','NEED INFO','확인 체크 없음','직접 확인 후 체크','USER'));const reqs=$('#rules').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const all=v.problem+' '+v.aiuse+' '+v.description;for(const req of reqs){if(/필수 입력|공개 링크|개인정보|기밀/.test(req))continue;const s=semantic(req,all);rows.push(s>0?row(req,'VERIFIED','작성 내용에서 관련 근거 발견','근거 문장 유지','AI SEMANTIC'):row(req,'RISK','직접 대응 문장이 약함','요구사항에 직접 답하는 문장 보강','AI SEMANTIC'))}last=rows;render()}function render(){const c={VERIFIED:0,FAIL:0,RISK:0,'NEED INFO':0};for(const x of last)c[x.status]=(c[x.status]||0)+1;$('#cv').textContent=c.VERIFIED;$('#cf').textContent=c.FAIL;$('#cr').textContent=c.RISK;$('#cn').textContent=c['NEED INFO'];const blocked=c.FAIL+c['NEED INFO'];$('#gateTitle').textContent=blocked?'READY TO SUBMIT: NO':'READY TO SUBMIT: YES';$('#gateSub').textContent=blocked?blocked+'개 치명 항목을 먼저 해결하세요.':'현재 증거 기준 치명 누락이 없습니다.';$('#gateBadge').textContent=blocked?'BLOCKED':'READY';$('#gateBadge').className='badge '+(blocked?'fail':'ok');$('#results').innerHTML=last.map(x=>'<div class="item"><div class="top"><b>'+esc(x.req)+'</b><span class="badge '+(x.status==='VERIFIED'?'ok':x.status==='FAIL'?'fail':x.status==='RISK'?'risk':'need')+'">'+x.status+'</span></div><div class="meta"><b>근거:</b> '+esc(x.evidence)+'<br><b>다음 행동:</b> '+esc(x.action)+'<br>'+esc(x.mode)+'</div></div>').join('')}$('#check').onclick=run;$('#submit').onclick=async()=>{await run();const bad=last.filter(x=>x.status==='FAIL'||x.status==='NEED INFO');if(bad.length){$('#modalBody').innerHTML=bad.map(x=>'• '+esc(x.req)).join('<br>');$('#overlay').style.display='flex'}else alert('FinalCheck 기준 READY TO SUBMIT 입니다. 데모에서는 실제 제출하지 않습니다.')};$('#close').onclick=()=>$('#overlay').style.display='none';$('#fix').onclick=()=>{$('#aiuse').value='AI는 자연어 요구사항을 분석해 현재 폼의 의미 충족 여부를 판정합니다. 빈칸·URL·형식은 코드가 검사합니다.';$('#privacy').checked=true};</script></body></html>
